[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-cli"
version = "0.1.0"
description = "A terminal-based party RPG MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.58.1,<1.0.0",
]

[project.optional-dependencies]
online = [
  "websockets>=12.0,<14.0",
]
server = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "sqlalchemy>=2.0.30,<3.0.0",
  "greenlet>=3.0.3,<4.0.0",
  "alembic>=1.13.0,<2.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "argon2-cffi>=23.1.0,<24.0.0",
  "pyjwt>=2.8.0,<3.0.0",
  "pydantic>=2.8.0,<3.0.0",
]

[project.scripts]
cryptclash = "dnd_cli.main:run"
"crypt-clash" = "dnd_cli.main:run"
dnd = "dnd_cli.main:run"
DND = "dnd_cli.main:run"
cryptclash-server = "dnd_cli.server.runner:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
